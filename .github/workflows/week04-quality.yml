name: Week04 Quality Check

on:
  push:
    paths:
      - "week04/practice/quality-lab/**"
      - ".github/workflows/week04-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: week04/practice/quality-lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ruff pytest pytest-cov

      - name: Check formatting
        run: ruff format --check .

      - name: Run linter
        run: ruff check .

      - name: Run tests with coverage
        run: pytest --cov=greetlab --cov-report=term-missing --cov-fail-under=80
